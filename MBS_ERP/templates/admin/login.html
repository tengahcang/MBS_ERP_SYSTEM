{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MBS ERP</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 3. Terapkan Font Roboto dan Gaya Halaman */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FFEFEF; /* Warna latar belakang pink muda */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 2.5rem; /* Padding di dalam card */
        }

        .login-title {
            font-weight: 700;
            font-size: 1.75rem;
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-label {
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 5px;
            border: 1px solid #ced4da;
        }

        .form-control:focus {
            border-color: #E53935; /* Warna border saat fokus */
            box-shadow: 0 0 0 0.2rem rgba(229, 57, 53, 0.25);
        }
        
        .btn-login {
            background-color: #E53935; /* Warna tombol login yang diminta */
            border: none;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 5px;
            font-weight: 700;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #c62828; /* Warna sedikit lebih gelap saat hover */
        }

        /* Hapus link "Kembali ke Website Utama" */
        .text-center.mt-3 {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card login-card bg-white">
        <h2 class="login-title">Login</h2>
        
        {% if form.errors and not form.non_field_errors %}
            <div class="alert alert-danger p-2 small mb-3">
                Username atau password salah.
            </div>
        {% endif %}

        {% if form.non_field_errors %}
            <div class="alert alert-danger p-2 small mb-3">
                {% for error in form.non_field_errors %}
                    {{ error }}
                {% endfor %}
            </div>
        {% endif %}

        <form action="{{ app_path }}" method="post" id="login-form">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" class="form-control" 
                       id="id_username" required autofocus>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" 
                       id="id_password" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-login">Login</button>
            </div>
        </form>
    </div>

</body>
</html>
